<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 648" width="760" height="648" font-family="Helvetica, Arial, sans-serif" font-size="11.5" role="img" aria-label="Every step of a deposit or a withdrawal is a ledger decision that nodes carry out">
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9a9a9a"/>
    </marker>
  </defs>
  <rect width="760" height="648" fill="#ffffff"/>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#1a1a1a">Every step of a deposit or a withdrawal is a ledger decision that nodes carry out</text>
  <text x="24" y="64" font-size="13" font-weight="600" fill="#1a1a1a">Deposit: XMR in, zXMR out</text>
  <text x="396" y="64" font-size="13" font-weight="600" fill="#1a1a1a">Withdrawal: zXMR burned, XMR out</text>
  <g fill="none" stroke="#9a9a9a" stroke-width="1.25">
    <path d="M194 144V168" marker-end="url(#flow-arrow)"/>
    <path d="M194 224V248" marker-end="url(#flow-arrow)"/>
    <path d="M194 304V328" marker-end="url(#flow-arrow)"/>
    <path d="M194 384V408" marker-end="url(#flow-arrow)"/>
    <path d="M194 464V488" marker-end="url(#flow-arrow)"/>
    <path d="M194 544V568" marker-end="url(#flow-arrow)"/>
    <path d="M566 144V168" marker-end="url(#flow-arrow)"/>
    <path d="M566 224V248" marker-end="url(#flow-arrow)"/>
    <path d="M566 304V328" marker-end="url(#flow-arrow)"/>
    <path d="M566 384V408" marker-end="url(#flow-arrow)"/>
    <path d="M566 464V488" marker-end="url(#flow-arrow)"/>
    <path d="M566 544V568" marker-end="url(#flow-arrow)"/>
  </g>
  <rect x="24" y="88" width="340" height="56" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
  <text x="40" y="112" font-size="13" font-weight="600" fill="#1a1a1a">1. Request (depositor, any node)</text>
  <text x="40" y="128" fill="#6b6b6b">a signed message naming the recipient; no gas</text>
  <rect x="24" y="168" width="340" height="56" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
  <text x="40" y="192" font-size="13" font-weight="600" fill="#1a1a1a">2. Address (ledger)</text>
  <text x="40" y="208" fill="#6b6b6b">a cluster is assigned; its next subaddress is bound</text>
  <rect x="24" y="248" width="340" height="56" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
  <text x="40" y="272" font-size="13" font-weight="600" fill="#1a1a1a">3. Payment (Monero)</text>
  <text x="40" y="288" fill="#6b6b6b">the depositor pays an address it can derive itself</text>
  <rect x="24" y="328" width="340" height="56" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
  <text x="40" y="352" font-size="13" font-weight="600" fill="#1a1a1a">4. Credit (ledger)</text>
  <text x="40" y="368" fill="#6b6b6b">a threshold of members reports it; credited once</text>
  <rect x="24" y="408" width="340" height="56" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
  <text x="40" y="432" font-size="13" font-weight="600" fill="#1a1a1a">5. Batch (cluster)</text>
  <text x="40" y="448" fill="#6b6b6b">open credits close under one root; one signature</text>
  <rect x="24" y="488" width="340" height="56" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
  <text x="40" y="512" font-size="13" font-weight="600" fill="#1a1a1a">6. Claim (settlement chain)</text>
  <text x="40" y="528" fill="#6b6b6b">leaf and proof submitted with the depositor gas</text>
  <rect x="24" y="568" width="340" height="56" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"/>
  <text x="40" y="592" font-size="13" font-weight="600" fill="#1a1a1a">7. Mint (settlement chain)</text>
  <text x="40" y="608" fill="#1a1a1a">zXMR less the fee goes to the named recipient</text>
  <rect x="396" y="88" width="340" height="56" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
  <text x="412" y="112" font-size="13" font-weight="600" fill="#1a1a1a">1. Burn (settlement chain)</text>
  <text x="412" y="128" fill="#6b6b6b">zXMR destroyed; the Monero address is in the event</text>
  <rect x="396" y="168" width="340" height="56" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
  <text x="412" y="192" font-size="13" font-weight="600" fill="#1a1a1a">2. Finality (ledger)</text>
  <text x="412" y="208" fill="#6b6b6b">the burn enters the ledger at the finalized tag</text>
  <rect x="396" y="248" width="340" height="56" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
  <text x="412" y="272" font-size="13" font-weight="600" fill="#1a1a1a">3. Assignment (ledger)</text>
  <text x="412" y="288" fill="#6b6b6b">one covering wallet, else pieces across clusters</text>
  <rect x="396" y="328" width="340" height="56" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
  <text x="412" y="352" font-size="13" font-weight="600" fill="#1a1a1a">4. Payout built and signed (cluster)</text>
  <text x="412" y="368" fill="#6b6b6b">every co-signer rebuilds the same transaction</text>
  <rect x="396" y="408" width="340" height="56" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
  <text x="412" y="432" font-size="13" font-weight="600" fill="#1a1a1a">5. Recorded, then relayed (ledger, Monero)</text>
  <text x="412" y="448" fill="#6b6b6b">the transaction id is public before broadcast</text>
  <rect x="396" y="488" width="340" height="56" rx="8" fill="none" stroke="#9a9a9a" stroke-width="1.25"/>
  <text x="412" y="512" font-size="13" font-weight="600" fill="#1a1a1a">6. Confirmation (Monero)</text>
  <text x="412" y="528" fill="#6b6b6b">members attest it at the confirmation depth</text>
  <rect x="396" y="568" width="340" height="56" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"/>
  <text x="412" y="592" font-size="13" font-weight="600" fill="#1a1a1a">7. Paid (ledger)</text>
  <text x="412" y="608" fill="#1a1a1a">the burn or piece is marked Paid, exactly once</text>
</svg>
